name: Canary Deployment Pipeline

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "prompts/**"
      - "Dockerfile"
      - "docker-compose.yml"
      - "requirements.txt"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  deploy-canary:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Production .env
        run: |
          echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" >> .env
          echo "JWT_SECRET=super-secret-prod-key-99" >> .env
          echo "JWT_ALGORITHM=HS256" >> .env
          echo "RATE_LIMIT_PER_MINUTE=60" >> .env

      - name: Start Gateway & Wait for Readiness
        run: |
          docker compose up -d --build app
          echo "Waiting for gateway to warm up embedding model and bind port 8000..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/metrics > /dev/null; then
              echo "✅ Gateway is ready!"
              exit 0
            fi
            sleep 3
          done
          echo "❌ Gateway failed to start within 90s"
          docker compose logs
          exit 1

      - name: Route 10% Traffic to Canary
        run: |
          echo "🚀 Activating Canary Version (v2) at 10% weight..."
          curl -sS --fail-with-body -X POST http://localhost:8000/admin/canary \
            -H "Content-Type: application/json" \
            -d '{"version": "v2", "weight": 0.10}'
          echo ""
          echo "✅ Canary routing activated."

      - name: Monitor Canary Health (Prometheus Watchdog)
        run: |
          echo "⏱️ Verifying canary state and Prometheus metrics..."
          sleep 5

          # 1. Confirm canary config is active in Redis
          CANARY_STATE=$(curl -sf http://localhost:8000/admin/prompts | jq -r '.canary_deployment.version // empty')
          if [ "$CANARY_STATE" != "v2" ]; then
            echo "❌ Expected active canary 'v2', got '${CANARY_STATE:-none}'!"
            echo "HEALTHY=false" >> $GITHUB_ENV
            exit 0
          fi

          # 2. Confirm /metrics is reachable
          if ! METRICS=$(curl -sf http://localhost:8000/metrics); then
            echo "❌ Gateway /metrics endpoint is unreachable!"
            echo "HEALTHY=false" >> $GITHUB_ENV
            exit 0
          fi

          # 3. Sum all 5xx responses (matches both grouped status="5xx" and exact status="500".."599")
          ERROR_5XX=$(echo "$METRICS" | awk '/^http_requests_total\{.*status="5(xx|[0-9][0-9])"/ {sum += $NF} END {printf "%.0f\n", sum + 0}')
          echo "Observed 5xx count: $ERROR_5XX"

          if [ "$ERROR_5XX" -gt 0 ]; then
            echo "🚨 Detected $ERROR_5XX server errors during canary check!"
            echo "HEALTHY=false" >> $GITHUB_ENV
          else
            echo "✅ Canary is healthy (canary active in Redis, /metrics responding, 0 server errors)."
            echo "HEALTHY=true" >> $GITHUB_ENV
          fi

      - name: Promote Canary to 100%
        if: env.HEALTHY == 'true'
        run: |
          echo "🟢 Canary passed health checks! Promoting v2 to 100% traffic."
          curl -sS --fail-with-body -X POST http://localhost:8000/admin/prompts/activate \
            -H "Content-Type: application/json" \
            -d '{"version": "v2"}'
          echo ""
          echo "✅ Deployment complete."

      - name: Rollback Canary
        if: env.HEALTHY == 'false'
        run: |
          echo "🚨 Canary failed health checks! Initiating rollback..."
          curl -sS --fail-with-body -X DELETE http://localhost:8000/admin/canary
          echo ""
          echo "Rollback complete. Failing deployment."
          exit 1
